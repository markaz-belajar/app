<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Jawaban Screening — Markz Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1B6CA8;--accent-dim:#e8f4fc;
  --text:#1C2B3A;--text2:#4A6070;--text3:#8FA4B4;
  --border:#EDE9DF;--bg:#FDFAF4;
  --success:#2E9E5B;--warning:#F59F00;--danger:#DC3545;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);background:#e9eef3;font-size:14px;line-height:1.6;}
.page{max-width:720px;margin:0 auto;padding:16px;}

.letterhead{background:var(--accent);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px;}
.letterhead-brand{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:800;}
.letterhead-sub{font-size:12px;opacity:0.85;margin-top:2px;}
.letterhead-title{font-size:14px;font-weight:700;margin-top:14px;border-top:1px solid rgba(255,255,255,0.25);padding-top:12px;}

.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(28,43,58,0.06);}
.card-title{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}

.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px;}
.score-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.score-num{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;color:var(--accent);}
.score-lbl{font-size:10px;color:var(--text3);margin-top:2px;}

.level-banner{border-radius:10px;padding:14px 16px;margin-top:12px;}
.level-banner strong{display:block;font-family:'Baloo 2',sans-serif;font-size:14px;margin-bottom:4px;}
.lv-minimal{background:#e7f7ef;color:var(--success);}
.lv-pantau{background:var(--accent-dim);color:var(--accent);}
.lv-moderat{background:#fef3c7;color:#92400e;}
.lv-kuat{background:#fff0e0;color:#b45309;}
.lv-sangat{background:#fde8e8;color:var(--danger);}

.source-tab{display:flex;gap:6px;margin-bottom:14px;}
.source-tab button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--text3);}
.source-tab button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.domain-hdr{font-size:13px;font-weight:800;color:var(--accent);margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent-dim);}
.domain-hdr:first-child{margin-top:0;}
.qitem{padding:12px 0;border-bottom:1px solid var(--border);}
.qitem:last-child{border-bottom:none;}
.qitem-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:6px;flex-shrink:0;}
.qitem-text{font-size:13.5px;font-weight:700;color:var(--text);display:inline;}
.qitem-note{font-size:12px;color:var(--text3);margin-top:4px;margin-left:26px;}
.qitem-answer{margin-top:8px;margin-left:26px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.ans-0{background:#e7f7ef;color:var(--success);}
.ans-1{background:#fef9e7;color:#92400e;}
.ans-2{background:#fff0e0;color:#b45309;}
.ans-3{background:#fde8e8;color:var(--danger);}
.qitem-basis{margin-top:8px;margin-left:26px;padding:10px 12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:12px;color:var(--text2);line-height:1.6;}
.qitem-basis cite{font-weight:700;font-style:normal;color:var(--accent);}
.qitem-guru-note{margin-top:8px;margin-left:26px;padding:10px 12px;background:#fffbea;border-left:3px solid var(--warning);border-radius:0 8px 8px 0;font-size:12.5px;color:#78350f;}
.qitem-guru-note strong{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;opacity:0.8;}

.disclaimer{background:#fef9e7;border:1px solid #fde68a;border-radius:10px;padding:14px 16px;font-size:12px;color:#92400e;line-height:1.6;}

.loading{text-align:center;padding:80px 20px;color:var(--text3);}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media print{ .source-tab{display:none;} .qitem, .domain-hdr{display:block!important;} }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="loading" id="loading">
    <svg class="spin" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B6CA8" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
    <div style="margin-top:12px;">Memuat detail jawaban...</div>
  </div>
  <div id="content" style="display:none;"></div>
</div>

<script>
const SCREENING_API = 'https://script.google.com/macros/s/AKfycbxRbHFQtaVYcUtFmCqJyZmAFxiY0T4bq4QImj2HICG0VajpVhi5zsFS66GfW1r5k0BN/exec';

function apiScreening(action, params={}) {
  const url = new URL(SCREENING_API);
  url.searchParams.set('action', action);
  for (const [k,v] of Object.entries(params)) url.searchParams.set(k, v);
  return fetch(url.toString(), { redirect:'follow' }).then(r => r.json()).catch(() => ({ ok:false }));
}

// ── Bank pertanyaan GURU (lengkap dengan dasar ilmiah) ──
const GURU_ITEMS = [
  { domain:"A", label:"Perhatian & kontak", items:[
    { text:"Tidak merespons atau lambat merespons saat namanya dipanggil guru", note:"Contoh: perlu dipanggil 2–3x baru bereaksi, atau tidak bereaksi sama sekali", basis:"<cite>Osterling & Dawson (1994)</cite> — kurangnya respons terhadap panggilan nama adalah indikator autisme paling awal dan dapat diamati bahkan sebelum diagnosis formal, terlihat jelas dalam konteks kelas kecil bimbel." },
    { text:"Menghindari atau sangat jarang melakukan kontak mata saat diajak bicara langsung", note:"Contoh: selalu melihat ke arah lain, ke meja, atau ke benda saat guru berbicara padanya", basis:"<cite>Jones & Klin (2013, Nature)</cite> — defisit kontak mata adalah indikator autisme paling konsisten dan dapat dideteksi bahkan dalam interaksi singkat 1-on-1 selama sesi bimbel." },
    { text:"Tampak tidak hadir atau sering melamun tanpa stimuli yang jelas", note:"Contoh: menatap kosong dalam waktu lama, tidak bereaksi terhadap aktivitas di sekitarnya", basis:"Terkait pola perhatian atipikal pada autisme — <cite>Keehn et al. (2013)</cite> menemukan perbedaan signifikan dalam orientasi perhatian yang dapat diamati selama sesi instruksi langsung." }
  ]},
  { domain:"B", label:"Komunikasi & bahasa", items:[
    { text:"Kesulitan mengikuti instruksi sederhana yang diberikan guru", note:"Contoh: tidak langsung memahami 'buka halaman 5', perlu diulang atau ditunjukkan secara fisik", basis:"Defisit pemrosesan bahasa reseptif adalah komponen kunci autisme. <cite>Paul (2008)</cite> menunjukkan kesulitan ini spesifik pada pemrosesan pragmatik, berbeda dari sekadar keterlambatan bahasa biasa." },
    { text:"Mengulangi kata atau kalimat yang baru didengar tanpa konteks yang relevan (echolalia)", note:"Contoh: mengulangi pertanyaan yang baru ditanya guru, mengulang kalimat dari video/buku di luar konteks", basis:"<cite>Prizant & Duchan (1981)</cite> — echolalia pada autisme adalah strategi komunikasi fungsional, bukan sekadar meniru. Dapat dengan jelas diamati dalam percakapan singkat selama sesi." },
    { text:"Cara berkomunikasi tidak biasa untuk usianya", note:"Contoh: bicara sangat formal/kaku, hanya menjawab satu kata, menggunakan gestur saja tanpa kata", basis:"Atypical pragmatic language adalah DSM-5 Kriteria A. <cite>Tager-Flusberg et al. (2009)</cite> — pola ini konsisten dan dapat dideteksi dalam percakapan pendek sekalipun." },
    { text:"Cara bicara terasa seperti hafalan atau diambil dari script — bukan percakapan spontan", note:"Contoh: menjawab pertanyaan dengan kalimat lengkap yang terdengar dihafal dari buku/TV, intonasi datar seperti membaca teks, atau menggunakan frasa orang dewasa yang tidak sesuai usianya", basis:"Scripted language adalah fitur linguistik khas autisme yang berbeda dari echolalia — <cite>Prizant (1983)</cite> mendokumentasikan penggunaan bahasa 'borrowed' sebagai strategi komunikasi yang dapat dideteksi dalam percakapan singkat." },
    { text:"Kesulitan mengikuti instruksi dua langkah sekaligus tanpa diulangi", note:"Contoh: 'ambil bukumu lalu duduk di kursi' — apakah ia hanya melakukan satu langkah, atau perlu instruksi diulang satu per satu?", basis:"Defisit working memory verbal dan pemrosesan instruksi sekuensial konsisten ditemukan pada autisme — <cite>Williams et al. (2006, J. Autism Dev. Disord.)</cite> membedakan ini dari keterlambatan bahasa murni melalui pola respons terhadap instruksi bertingkat." }
  ]},
  { domain:"C", label:"Perilaku selama sesi", items:[
    { text:"Melakukan gerakan tubuh berulang selama sesi belajar (stimming)", note:"Contoh: mengepakkan tangan, mengayun badan, mengetuk-ngetuk meja berulang kali secara konsisten", basis:"<cite>Turner (1999)</cite> — stimming berfungsi sebagai regulasi sensorik pada autisme. Berbeda dari kegelisahan biasa dalam hal pola yang konsisten dan intensitasnya. Sangat terlihat dalam sesi 1 jam." },
    { text:"Reaksi berlebihan atau tidak biasa saat ada perubahan kecil selama sesi", note:"Contoh: sangat terganggu saat ganti aktivitas, guru berbeda hadir, atau posisi duduk berubah", basis:"Insistence on sameness — DSM-5 Kriteria B.2. Momen transisi antar aktivitas dalam sesi bimbel adalah salah satu kesempatan observasi paling informatif untuk indikator ini." },
    { text:"Fokus sangat terpaku pada satu hal sambil mengabaikan hal lain sepenuhnya", note:"Contoh: sangat terpaku pada satu soal/benda tapi mengabaikan semua instruksi berikutnya", basis:"Terkait monotropism — <cite>Murray et al. (2005)</cite> — kecenderungan autisme untuk memfokuskan perhatian secara intens pada satu hal sekaligus. Berbeda dari ADHD yang lebih fluktuatif." },
    { text:"Bermain atau memegang benda dengan cara yang tidak biasa dan berulang", note:"Contoh: memutar pensil terus-menerus, menyusun penghapus dalam barisan sebelum mulai belajar, membolak-balik buku tanpa membaca, atau fokus pada satu bagian benda tertentu secara intens", basis:"Non-functional object use adalah DSM-5 Kriteria B.1 — <cite>Libby et al. (1998, J. Autism Dev. Disord.)</cite> menemukan penggunaan benda tidak fungsional secara konsisten membedakan anak autisme dari anak dengan keterlambatan perkembangan lain." }
  ]},
  { domain:"D", label:"Interaksi sosial di bimbel", items:[
    { text:"Tidak tertarik atau kesulitan berinteraksi dengan teman bimbel lainnya", note:"Contoh: selalu bermain sendiri saat waktu bebas, tidak merespons ajakan teman, tidak memulai obrolan", basis:"DSM-5 Kriteria A.3 — defisit dalam mengembangkan hubungan dengan teman sebaya. Konteks bimbel kelompok kecil memberi kesempatan observasi langsung interaksi peer dalam kondisi semi-natural." },
    { text:"Respons emosional selama sesi yang tidak sesuai konteks", note:"Contoh: tertawa tanpa sebab jelas, menangis karena hal yang tampak sepele, atau tidak bereaksi saat seharusnya", basis:"<cite>Mazefsky et al. (2013)</cite> — dysregulation emosi pada autisme berbeda dari tantrum biasa dalam hal pola, pemicu, dan durasi. Dapat diamati bahkan dalam interaksi pendek." }
  ]}
];

const ANS_LABEL_GURU = { 0:"0 — Tidak pernah", 1:"1 — Kadang", 2:"2 — Sering", 3:"3 — Selalu" };

function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }); }
  catch { return iso; }
}
function levelClass(l) {
  return { Minimal:'lv-minimal', 'Perlu pantau':'lv-pantau', Moderat:'lv-moderat', Kuat:'lv-kuat', 'Sangat kuat':'lv-sangat' }[l] || 'lv-pantau';
}
function levelNarrative(level, nama) {
  const m = {
    Minimal: `Berdasarkan observasi guru dan laporan orang tua, tidak ditemukan pola perilaku yang menonjol pada ${nama}. Lanjutkan pemantauan rutin.`,
    'Perlu pantau': `Beberapa pola perilaku pada ${nama} teramati, namun belum cukup konsisten. Lanjutkan observasi 4–6 minggu ke depan.`,
    Moderat: `Pola perilaku yang cukup konsisten teramati pada ${nama}. Rekomendasikan diskusi lebih dalam dan pertimbangkan rujukan awal ke profesional.`,
    Kuat: `Pola konsisten di beberapa domain penting pada ${nama}. Segera jadwalkan pertemuan dan sarankan asesmen formal.`,
    'Sangat kuat': `Pola sangat konsisten hampir di seluruh domain pada ${nama}. Prioritaskan rujukan ke psikolog klinis anak / psikiater anak.`
  };
  return m[level] || '';
}
function parentAnswerNarrative(idx) {
  const m = ["Pola yang wajar, tidak menunjukkan indikasi kekhawatiran.","Pola sesekali muncul, dalam batas wajar untuk sebagian besar anak.","Pola cukup sering muncul — perlu diperhatikan dan didiskusikan.","Pola sangat sering/konsisten muncul — perlu perhatian lebih serius."];
  return m[idx] || '';
}

let VIEW = 'guru';
function switchView(v) {
  VIEW = v;
  document.querySelectorAll('.source-tab button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  document.getElementById('guru-detail').style.display = v==='guru' ? 'block':'none';
  document.getElementById('ortu-detail').style.display = v==='ortu' ? 'block':'none';
}

async function buildDetail() {
  const p = new URLSearchParams(window.location.search);
  const gen = p.get('gen');
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');

  if (!gen) { loading.innerHTML = '<div style="color:#dc2626;">Kode siswa (gen) tidak ditemukan di URL.</div>'; return; }

  const [rSiswa, rDetail] = await Promise.all([
    apiScreening('getSiswaByGenId', { genId: gen }),
    apiScreening('getScreeningDetail', { genId: gen })
  ]);

  if (!rDetail || !rDetail.ok || !rDetail.data) { loading.innerHTML = '<div style="color:#dc2626;">Data tidak ditemukan.</div>'; return; }

  const d = rDetail.data;
  const siswa = (rSiswa && rSiswa.ok && rSiswa.data) ? rSiswa.data : {};
  const nama = siswa.nama || d.namaAnak || '—';
  const namaDepan = nama.split(' ')[0];

  if (d.statusOrtu !== 'selesai' || d.statusGuru !== 'selesai') {
    loading.innerHTML = `<div style="text-align:center;"><div style="font-size:32px;margin-bottom:10px;">⏳</div><div style="font-weight:800;">Detail belum bisa ditampilkan</div><div style="font-size:12px;color:#8FA4B4;margin-top:6px;">${d.statusOrtu!=='selesai'?'Orang tua belum menyelesaikan form. ':''}${d.statusGuru!=='selesai'?'Guru belum menyelesaikan form observasi.':''}</div></div>`;
    return;
  }

  const answersOrtu = d.answersOrtu || {};
  const answersGuru = d.answersGuru || {};
  const notesGuru   = d.notesGuru || {};
  const skorOrtu = Math.round(Number(d.skorOrtu)||0);
  const skorGuru = Math.round(Number(d.skorGuru)||0);
  const skorGab  = Math.round(Number(d.skorGabungan)||0);
  const level    = d.levelGabungan || '—';

  // ── Tentukan bracket usia untuk ambil bank pertanyaan ortu ──
  const usiaTahun = Number(siswa.usiaTahun);
  let bracket = null;
  if (!isNaN(usiaTahun)) {
    if (usiaTahun>=4 && usiaTahun<=5) bracket='A';
    else if (usiaTahun>=6 && usiaTahun<=8) bracket='B';
    else if (usiaTahun>=9 && usiaTahun<=10) bracket='C';
    else if (usiaTahun>=11 && usiaTahun<=12) bracket='D';
    else bracket = usiaTahun<4 ? 'A' : 'D';
  } else { bracket = 'A'; }
  const parentDomains = ITEMS_BY_AGE[bracket] || ITEMS_BY_AGE['A'];

  // ── Render GURU detail ──
  let guruHtml = '';
  let qNum = 1;
  GURU_ITEMS.forEach(dom => {
    guruHtml += `<div class="domain-hdr">Domain ${dom.domain} — ${dom.label}</div>`;
    dom.items.forEach((item, idx) => {
      const key = `${dom.domain}_${idx}`;
      const val = Number(answersGuru[key]);
      const noteText = notesGuru[key];
      guruHtml += `<div class="qitem">
        <span class="qitem-num">${qNum++}</span><span class="qitem-text">${item.text}</span>
        <div class="qitem-note">${item.note}</div>
        ${!isNaN(val) ? `<div class="qitem-answer ans-${val}">${ANS_LABEL_GURU[val]}</div>` : ''}
        ${(!isNaN(val) && val>=1) ? `<div class="qitem-basis">📚 ${item.basis}</div>` : ''}
        ${noteText ? `<div class="qitem-guru-note"><strong>Catatan Guru</strong>${noteText}</div>` : ''}
      </div>`;
    });
  });

  // ── Render ORANG TUA detail ──
  let ortuHtml = '';
  let qNum2 = 1;
  parentDomains.forEach(dom => {
    ortuHtml += `<div class="domain-hdr">Domain ${dom.domain} — ${dom.label}</div>`;
    dom.items.forEach((item, idx) => {
      const key = `${dom.domain}_${idx}`;
      const val = Number(answersOrtu[key]);
      const chosenOpt = !isNaN(val) ? item.opts[val] : null;
      ortuHtml += `<div class="qitem">
        <span class="qitem-num">${qNum2++}</span><span class="qitem-text">${item.q}</span>
        <div class="qitem-note">${item.example}</div>
        ${chosenOpt ? `<div class="qitem-answer ans-${val}">${chosenOpt}</div>` : ''}
        ${(!isNaN(val)) ? `<div class="qitem-basis">📚 ${parentAnswerNarrative(val)}</div>` : ''}
      </div>`;
    });
  });

  content.innerHTML = `
    <div class="letterhead">
      <div class="letterhead-brand">Markz Belajar</div>
      <div class="letterhead-sub">Detail Jawaban Screening — ${nama}</div>
      <div class="letterhead-title">Rincian lengkap jawaban Orang Tua &amp; Guru, beserta interpretasi berdasarkan referensi ilmiah</div>
    </div>

    <div class="card">
      <div class="card-title">Ringkasan Skor Gabungan</div>
      <div class="score-row">
        <div class="score-box"><div class="score-num">${skorOrtu}%</div><div class="score-lbl">Orang Tua (${Object.keys(answersOrtu).length} soal)</div></div>
        <div class="score-box"><div class="score-num">${skorGuru}%</div><div class="score-lbl">Guru (${Object.keys(answersGuru).length} soal)</div></div>
        <div class="score-box"><div class="score-num">${skorGab}%</div><div class="score-lbl">Gabungan</div></div>
      </div>
      <div class="level-banner ${levelClass(level)}">
        <strong>${level}</strong>${levelNarrative(level, namaDepan)}
      </div>
    </div>

    <div class="source-tab">
      <button data-v="guru" onclick="switchView('guru')" class="active">👩‍🏫 Jawaban Guru</button>
      <button data-v="ortu" onclick="switchView('ortu')">🏠 Jawaban Orang Tua</button>
    </div>

    <div class="card" id="guru-detail">
      <div class="card-title">Detail Observasi Guru — Sesi Bimbel</div>
      ${guruHtml}
    </div>
    <div class="card" id="ortu-detail" style="display:none;">
      <div class="card-title">Detail Laporan Orang Tua — di Rumah</div>
      ${ortuHtml}
    </div>

    <div class="disclaimer">
      ⚠️ Interpretasi di atas adalah alat bantu observasi awal, bukan diagnosis. Rujukan ke psikolog klinis anak / psikiater anak tetap diperlukan untuk asesmen formal.
    </div>
  `;

  loading.style.display = 'none';
  content.style.display = 'block';
}

const ITEMS_BY_AGE = {

  // ── 4–5 TAHUN (TK) ──
  A: [
    { domain:"A", label:"Komunikasi di rumah", clinicalLabel:"Bahasa & komunikasi ekspresif", icon:"chat", items:[
      { q:"Bagaimana cara si kecil mengungkapkan keinginannya?",
        example:"Misalnya saat lapar, haus, atau ingin mainan — apakah ia bicara dengan kata-kata, menunjuk, menarik tangan Ayah/Bunda, atau diam saja?",
        opts:["Bicara dengan kalimat pendek yang jelas","Bicara satu kata atau kalimat singkat","Lebih sering menunjuk atau menarik tangan","Hampir tidak pernah mengungkapkan, harus ditebak"] },
      { q:"Seberapa sering si kecil menyebut nama atau memanggil Ayah/Bunda secara spontan?",
        example:"Misalnya tiba-tiba memanggil 'Mama!' untuk menunjukkan sesuatu, atau memanggil saat ingin diperhatikan.",
        opts:["Sering, dengan inisiatif yang tinggi","Kadang-kadang memanggil sendiri","Jarang, biasanya hanya saat diajak bicara dulu","Hampir tidak pernah memanggil sendiri"] },
      { q:"Apakah si kecil pernah mengulangi kata atau kalimat yang baru didengar berulang-ulang?",
        example:"Misalnya mengulangi kata dari lagu, iklan TV, atau kalimat yang baru diucapkan orang lain — tanpa konteks yang jelas.",
        opts:["Tidak, jarang sekali","Sesekali, tapi masih wajar","Cukup sering mengulangi kata atau kalimat orang lain","Sering sekali, seperti rekaman yang diputar ulang"] },
      { q:"Apakah si kecil langsung merespons saat namanya dipanggil dari jarak dekat?",
        example:"Misalnya Ayah/Bunda memanggil namanya dari ruangan yang sama — apakah ia langsung menoleh, atau seolah tidak mendengar meski pendengarannya normal?",
        opts:["Selalu merespons dengan segera","Biasanya merespons, kadang perlu dipanggil 2x","Sering tidak merespons, perlu dipanggil beberapa kali","Hampir tidak pernah merespons panggilan namanya"] },
